<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{--ink:#141433;--yellow:#ffd23f;--orange:#ff8a1f;--green:#56d64a;--green-d:#2e9c25;--blue:#3fb6ff;--pink:#ff4fa3;--red:#ff4d4d;--muted:#6b6f99;--pale:#e6e9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Jua','Lilita One',-apple-system,"Apple SD Gothic Neo",sans-serif;color:#fff;background:linear-gradient(160deg,#1e3a8a 0%,#3b2a9e 55%,#5b21b6 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 26px,transparent 26px 52px);pointer-events:none}
#app{position:relative;max-width:540px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
.en{font-family:'Lilita One','Jua',sans-serif}
h1{font-family:'Lilita One','Jua',sans-serif;text-align:center;font-size:3rem;margin:34px 0 8px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink),0 9px 0 rgba(0,0,0,.35);letter-spacing:1px;animation:float 3s ease-in-out infinite;line-height:1.05}
h1 small{display:block;font-family:'Jua';font-size:1.3rem;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink);letter-spacing:0;margin-top:6px}
h2{font-size:1.15rem;margin:26px 0 10px;color:var(--yellow);text-shadow:0 2px 0 var(--ink)}
@keyframes float{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-7px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes slidein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:20px;margin:16px 0;text-align:center;animation:slidein .3s}
.card.tilt{transform:rotate(-1.5deg)}
.card.tilt2{transform:rotate(1.2deg)}
.lbl{color:var(--muted);font-size:1rem}
.big{font-family:'Lilita One';font-size:3rem;color:var(--orange);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink);line-height:1.1}
.big span{font-family:'Jua';-webkit-text-stroke:0;color:var(--ink);text-shadow:none}
.sub{color:rgba(255,255,255,.8);margin-top:6px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.card .sub{color:var(--muted);text-shadow:none}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;box-shadow:0 3px 0 var(--ink);transform:rotate(-2deg);font-size:1.1rem}
.btn{display:block;width:100%;padding:16px;border:4px solid var(--ink);border-radius:18px;font-size:1.4rem;margin:14px 0;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 7px 0 var(--ink);font-family:'Jua';transition:transform .06s}
.btn.primary{background:linear-gradient(#8ff57f,var(--green) 45%,var(--green-d));color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink);font-size:1.8rem;letter-spacing:1px}
.btn.blue{background:linear-gradient(#8ad8ff,var(--blue) 45%,#1a8fd6);color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:none;font-size:1.1rem}
.btn.link{background:none;border:0;box-shadow:none;color:rgba(255,255,255,.6);font-size:1rem}
.btn.danger{background:var(--red);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn.ghost:active,.btn.link:active{transform:none}
.btn:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:8px;text-shadow:0 2px 0 var(--ink);font-size:1.05rem}
.ico{border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:4px 10px;font-size:1rem;cursor:pointer;font-family:'Jua';box-shadow:0 3px 0 var(--ink)}
.bar{height:16px;background:rgba(0,0,0,.35);border:3px solid var(--ink);border-radius:10px;overflow:hidden;margin:8px 0 22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7fe7ff);transition:width .3s}
.prompt{text-align:center;margin:26px 0 22px}
.word{font-family:'Lilita One';font-size:3.4rem;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);word-break:break-word;line-height:1.1}
.ko{font-size:2.2rem;text-shadow:0 4px 0 var(--ink);word-break:keep-all;line-height:1.2}
.spk{border:3px solid var(--ink);background:#fff;border-radius:50%;width:58px;height:58px;font-size:1.5rem;margin-top:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opts{display:grid;gap:14px}
.opt{padding:18px;font-size:1.4rem;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 6px 0 var(--ink);cursor:pointer;text-align:center;font-family:'Jua';color:var(--ink)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.ok{background:var(--green);color:#fff;text-shadow:0 2px 0 var(--ink);animation:pop .35s}
.opt.bad{background:var(--red);color:#fff;text-shadow:0 2px 0 var(--ink);animation:shake .4s}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:10px 0 26px;min-height:54px}
.slot{width:42px;height:54px;border-radius:12px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:1.7rem;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.slot.fixed{background:var(--pale);color:var(--muted)}
.slot.open{background:rgba(255,255,255,.15);border-style:dashed;border-color:#fff;color:#fff}
.slot.cur{border-style:solid;border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,210,63,.45),0 4px 0 var(--ink)}
.slot.ok{background:var(--green);color:#fff;border-style:solid;border-color:var(--ink);animation:pop .35s}
.slot.bad{background:var(--red);color:#fff;border-style:solid;border-color:var(--ink);animation:shake .4s}
.gap{width:14px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{width:54px;height:58px;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#ffe97a,var(--yellow) 55%,#f2b300);font-family:'Lilita One';font-size:1.7rem;color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile:disabled{opacity:.2;transform:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row .btn{width:auto;padding:12px 22px}
.inp{width:100%;padding:16px;font-size:1.8rem;border:4px solid var(--ink);border-radius:16px;text-align:center;margin-top:10px;font-family:'Lilita One';color:var(--ink);box-shadow:inset 0 4px 0 var(--pale);outline:none}
.inp:focus{box-shadow:inset 0 4px 0 var(--pale),0 0 0 4px rgba(255,210,63,.5)}
.hint{text-align:center;font-size:1.6rem;letter-spacing:.1em;color:var(--yellow);text-shadow:0 3px 0 var(--ink);min-height:1.8em;font-family:'Lilita One'}
.good{text-align:center;color:var(--green);-webkit-text-stroke:.6px var(--ink);text-shadow:0 3px 0 var(--ink);font-family:'Jua';font-size:1.45rem;margin-top:14px;animation:pop .4s;line-height:1.3}
.cheer{display:block;font-size:1.05rem;color:var(--yellow);margin-top:6px;-webkit-text-stroke:0}
.wrongmsg{text-align:center;font-size:1.3rem;margin-top:14px;text-shadow:0 2px 0 var(--ink)}
.wrongmsg b{color:var(--yellow);font-family:'Lilita One';font-size:1.5rem}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:12px 20px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;z-index:9;font-size:1.1rem}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(10,10,40,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.show{display:flex}
#modal .card{max-width:360px;width:100%;margin:0}
.panel{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:10px 14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:2px solid var(--pale);text-align:left;font-size:.95rem;vertical-align:middle}
th{color:var(--muted);font-weight:normal}
textarea{width:100%;padding:12px;border:4px solid var(--ink);border-radius:14px;font-size:1rem;font-family:'Jua';color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.list div{padding:8px 0;border-bottom:2px solid var(--pale)}
.list div:last-child{border:0}
.wl{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;margin:10px 0;font-size:1.25rem;cursor:pointer;box-shadow:0 5px 0 var(--ink);animation:slidein .3s}
.wl b{font-family:'Lilita One';font-size:1.4rem}
.wl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.stars{color:#f2b300;font-size:1rem;letter-spacing:1px;white-space:nowrap;-webkit-text-stroke:.5px var(--ink)}
.x{border:0;background:none;color:#b8bce0;font-size:1.2rem;cursor:pointer}
.muted{color:var(--muted)}
.grid2{grid-template-columns:1fr 1fr}
.opt.en{font-family:'Lilita One';font-size:1.5rem}
.opt.gone{opacity:.25;pointer-events:none}
.tbtn{display:flex;justify-content:space-between;align-items:center;font-size:1.25rem}
.tbtn small{font-family:'Jua';font-size:1rem;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;margin:6px 0 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;background:rgba(255,255,255,.15);color:#fff;font-family:'Jua';font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--yellow);color:var(--ink)}
.grp{background:var(--pale);color:var(--ink);font-size:1rem}
.grp td{padding:6px}
</style>
</head>

let S=load(), view='home';
function migrate(s){
  s.words=(s.words||[]).map(w=>{
    w={...w,group:w.group||'기본',mastery:w.mastery||0,box:w.box||0,due:w.due||null,form:w.form||''};
    const bad=/^([a-z][a-z ]*?)\s*,\s*([^a-z].*)$/i.exec(w.ko||'');   // 예전 버그: 변화형이 뜻 앞에 붙은 경우
    if(bad){w.form=w.form||bad[1].trim();w.ko=bad[2].trim();}
    return w;
  });
  s.sessions=s.sessions||[];s.group=s.group||'';s.cur=s.cur||null;
  if(s.cur){s.cur.queue=s.cur.queue||[];s.cur.wrong=s.cur.wrong||{};s.cur.bossWrong=s.cur.bossWrong||{};s.cur.wids=s.cur.wids||[];}
  return s;
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.words)return migrate(s);}catch(e){}return {words:[],sessions:[],cur:null,group:''};}
function groups(){return [...new Set(S.words.map(w=>w.group))];}
function pool(){return S.group?S.words.filter(w=>w.group===S.group):S.words;}
function setGroup(g){S.group=g;save();showHome();}
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(famRef){clearTimeout(pushT);pushT=setTimeout(()=>famRef.set(strip(S)),300);}}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return fmt(new Date());}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(m){return '★'.repeat(m)+'☆'.repeat(5-m);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;speechSynthesis.speak(u);}catch(e){}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2500);}

// ── 단어 입력 ─────────────────────────────────────────
// 한 줄 = 영어부분 + 뜻부분. 구분은 탭 / : | 또는 첫 한글 앞. 영어부분 안의 "pretend - pretended"는 변화형으로 따로 저장.
function parseWords(text){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const m=line.split(/\t|\s*[\/|:]\s*/).map(x=>x.trim()).filter(Boolean);
    let enPart,koPart;
    if(m.length>=2){enPart=m[0];koPart=m.slice(1).join(', ');}
    else{const i=line.search(/[가-힣~]/);if(i<=0)return;enPart=line.slice(0,i);koPart=line.slice(i);}
    const forms=enPart.split(/\s*[-–,]\s*|\s{2,}/).map(x=>x.trim().toLowerCase()).filter(x=>/^[a-z][a-z' ]*$/.test(x));
    const en=forms[0];if(!en||!/[a-z]/.test(en))return;
    koPart=koPart.replace(/^[-–,\s]+/,'').trim();if(!koPart)return;
    out.push({en,form:forms.slice(1).join(', '),ko:koPart});
  });
  return out;
}
function addWords(list,group){
  let n=0;group=(group||'').trim()||'기본';
  list.forEach(({en,ko,form})=>{
    const ex=S.words.find(w=>w.en===en);
    if(ex){ex.ko=ko;ex.form=form||'';ex.group=group;return;}
    S.words.push({id:uid(),en,ko,form:form||'',group,mastery:0,box:0,due:null,miss:null,lastMiss:null});n++;
  });
  save();return n;
}

// ── 오늘의 단어 고르기 ────────────────────────────────
function pickToday(){
  const P=pool();
  if(P.length<4)return [];
  const t=today();
  const due=P.filter(w=>w.due&&w.due<=t).sort((a,b)=>a.mastery-b.mastery||a.due.localeCompare(b.due));
  const fresh=P.filter(w=>!w.due);
  let pick=due.slice(0,6);
  pick=pick.concat(fresh.slice(0,Math.min(5,10-pick.length)));
  if(pick.length<10){
    const rest=P.filter(w=>w.due&&!pick.includes(w)).sort((a,b)=>a.mastery-b.mastery||a.due.localeCompare(b.due));
    pick=pick.concat(rest.slice(0,10-pick.length));
  }
  return pick.map(w=>w.id);
}

// ── 세션 진행 ─────────────────────────────────────────
function startSession(){
  const wids=pickToday();if(!wids.length)return;
  S.cur={date:today(),wids,round:0,queue:[],idx:0,wrong:{},bossWrong:{},exits:0,seconds:0,tick:Date.now()};
  buildRound();save();showPreview();
}
function startTest(g){
  const ws=g?S.words.filter(w=>w.group===g):S.words;
  if(ws.length<4)return;
  S.cur={date:today(),wids:shuffle(ws).map(w=>w.id),round:ROUNDS.length-1,queue:[],idx:0,wrong:{},bossWrong:{},exits:0,seconds:0,tick:Date.now(),test:g||'전체'};
  buildRound();save();showRoundIntro();
}
function resumeSession(){S.cur.tick=Date.now();save();if(S.cur.idx===0)showRoundIntro();else showItem();}
function bossType(w){
  const m=w.mastery;
  const pool=m>=4?['write','blank','spell','spot']:m>=2?['blank','spell','english','spot','match']:['meaning','english','spell','match'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildRound(){
  const c=S.cur,type=ROUNDS[c.round],boss=type==='boss';
  c.queue=shuffle(c.wids).map(wid=>({wid,type:boss?bossType(W(wid)):type,retry:0,boss}));
  c.idx=0;
}
function tickTime(){const c=S.cur,now=Date.now();c.seconds+=Math.min(120,(now-c.tick)/1000);c.tick=now;}
function answer(ok){
  const c=S.cur;if(!c)return;
  const it=c.queue[c.idx],w=W(it.wid);
  tickTime();
  if(ok){
    if(it.retry===0&&!it.boss)w.mastery=Math.max(w.mastery,TYPE_LEVEL[it.type]);
  }else{
    c.wrong[it.wid]=(c.wrong[it.wid]||0)+1;
    if(it.boss)c.bossWrong[it.wid]=(c.bossWrong[it.wid]||0)+1;
    // ponytail: 틀린 단어는 2~3문제 뒤에 다시, 최대 2번까지
    if(it.retry<2)c.queue.splice(Math.min(c.idx+3,c.queue.length),0,{...it,retry:it.retry+1});
  }
  c.idx++;
  if(c.idx>=c.queue.length){
    c.round++;
    if(c.round>=ROUNDS.length){finish();return;}
    buildRound();save();showRoundIntro();return;
  }
  save();showItem();
}
function finish(){
  const c=S.cur,t=today(),conquered=[],retry=[];
  c.wids.forEach(id=>{
    const w=W(id),wrong=c.wrong[id]||0,bw=c.bossWrong[id]||0;
    if(bw===0){conquered.push(id);w.due=addDays(t,INTERVALS[Math.min(w.box||0,4)]);w.box=(w.box||0)+1;}
    else{retry.push(id);w.box=0;w.due=addDays(t,1);}
    if(wrong>0)w.mastery=Math.max(0,w.mastery-1);
  });
  const rec={date:t,wids:c.wids,conquered,retry,seconds:Math.round(c.seconds),exits:c.exits,test:c.test||null};
  S.sessions.push(rec);S.cur=null;save();
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  showResult(rec);
}

const GAMES={};
function optionsFor(w,key){
  const others=shuffle(S.words.filter(x=>x.id!==w.id&&x[key]!==w[key])).slice(0,3);

}
function bindOpts(attr,rightVal,sayOnOk,rightEn){
  let done=false;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const ok=b.dataset[attr]===rightVal;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset[attr]===rightVal)x.classList.add('ok');});
    if(!ok)b.classList.add('bad');
    if(sayOnOk)speak(sayOnOk);
    const fb=$('#fb');if(fb)fb.innerHTML=fbHtml(ok,rightEn||sayOnOk||'');
    setTimeout(()=>answer(ok),ok?1000:1900);
  });
}
GAMES.meaning=w=>{
  const opts=optionsFor(w,'ko');
  $('#g').innerHTML=`<div class="prompt"><div class="word">${esc(w.en)}</div><button class="spk" data-say="${esc(w.en)}">🔊</button></div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.ko)}</button>`).join('')}</div><div id="fb"></div>`;
  speak(w.en);bindOpts('id',w.id,null,w.ko);
};
GAMES.english=w=>{
  const opts=optionsFor(w,'en');
  $('#g').innerHTML=`<div class="prompt"><div class="ko">${esc(w.ko)}</div></div>
    <div class="opts">${opts.map(o=>`<button class="opt en" data-id="${o.id}">${esc(o.en)}</button>`).join('')}</div><div id="fb"></div>`;
  bindOpts('id',w.id,w.en);

function tileGame(w,open,bankChars){
  const chars=w.en.split('');
  const bank=shuffle(bankChars).map((ch,i)=>({ch,i}));
  const fill={},order=[];let done=false;
  const draw=state=>{
    const g=$('#g'),next=open.find(p=>!fill[p]);
    g.innerHTML=`<div class="prompt"><div class="ko">${esc(w.ko)}</div><button class="spk" data-say="${esc(w.en)}">🔊</button></div>
      <div class="slots">${chars.map((ch,p)=>{if(ch===' ')return '<span class="gap"></span>';const o=open.includes(p);const v=o?(fill[p]?fill[p].ch:''):ch;return `<span class="slot ${o?'open':'fixed'} ${o&&p===next?'cur':''} ${o?(state||''):''}">${esc(v)}</span>`;}).join('')}</div>
      <div class="tiles">${bank.map(t=>`<button class="tile" data-i="${t.i}" ${order.some(p=>fill[p]===t)||done?'disabled':''}>${esc(t.ch)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" id="undo" ${done?'disabled':''}>← 지우기</button></div><div id="fb"></div>`;
    g.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
      const t=bank[+b.dataset.i],p=open.find(p=>!fill[p]);
      if(p===undefined||done)return;
      fill[p]=t;order.push(p);
      if(order.length===open.length)check();else draw();
    });
    g.querySelector('#undo').onclick=()=>{const p=order.pop();if(p!==undefined){delete fill[p];draw();}};
  };
  const check=()=>{
    const ok=open.every(p=>fill[p].ch===chars[p]);done=true;draw(ok?'ok':'bad');
    $('#fb').innerHTML=fbHtml(ok,w.en);
    if(ok)speak(w.en);
    setTimeout(()=>answer(ok),ok?1000:2000);
  };
  draw();
}
GAMES.spell=w=>{
  const open=w.en.split('').map((c,i)=>c!==' '?i:-1).filter(i=>i>=0);
  tileGame(w,open,open.map(i=>w.en[i]));
};
function blankPositions(w,hard){
  const idx=w.en.split('').map((c,i)=>c!==' '?i:-1).filter(i=>i>=0);
  const n=hard?Math.min(idx.length,Math.max(2,Math.ceil(idx.length*0.4))):1;
  const miss=w.miss||{};
  // 자주 틀린 자리부터 빈칸으로 (동점이면 무작위)
  return shuffle(idx).sort((a,b)=>(miss[b]||0)-(miss[a]||0)).slice(0,n).sort((a,b)=>a-b);
}
GAMES.blank=(w,it)=>{
  const hard=it.boss||w.mastery>=4;
  const open=blankPositions(w,hard);
  const missing=open.map(p=>w.en[p]);
  const pool=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!w.en.includes(c)));
  tileGame(w,open,missing.concat(pool.slice(0,3)));
};
function recordMiss(w,typed){
  w.miss=w.miss||{};
  for(let i=0;i<w.en.length;i++)if(typed[i]!==w.en[i])w.miss[i]=(w.miss[i]||0)+1;
  w.lastMiss=typed;save();
}
GAMES.write=w=>{
  let tries=0,done=false;
  const n=w.en.length;
  const hint1=w.en.split('').map((c,i)=>i===0||i===n-1||c===' '?c:'_').join(' ');
  const hint2=w.en.split('').map((c,i)=>i<Math.ceil(n*0.4)||i>=n-Math.ceil(n*0.3)||c===' '?c:'_').join(' ');
  const draw=hint=>{
    $('#g').innerHTML=`<div class="prompt"><div class="ko">${esc(w.ko)}</div></div>
      <div class="hint">${hint||'&nbsp;'}</div>
      <input id="inp" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 써 보세요">
      <button class="btn primary" id="ok">확인</button><div id="fb"></div>`;
    const i=$('#inp');i.focus();
    $('#ok').onclick=submit;i.onkeydown=e=>{if(e.key==='Enter')submit();};
  };
  const submit=()=>{
    if(done)return;
    const v=$('#inp').value.trim().toLowerCase();if(!v)return;
    if(v===w.en){
      done=true;speak(w.en);
      $('#fb').innerHTML=tries===0?fbHtml(true):'<div class="good">힌트로 맞혔어요! 다시 한 번 나올 거예요</div>';
      setTimeout(()=>answer(tries===0),tries===0?1000:1500);return;
    }
    tries++;recordMiss(w,v);
    if(tries===1)draw('힌트: '+esc(hint1));
    else if(tries===2)draw('힌트: '+esc(hint2));
    else{done=true;speak(w.en);$('#fb').innerHTML=fbHtml(false,w.en);setTimeout(()=>answer(false),2200);}
  };
  draw();
};

// 철자 탐정: 진짜 철자 하나 + 그럴듯한 오타들
const rnd=n=>Math.floor(Math.random()*n);
function misspell(en){
  const v='aeiou';
  const ops=[
    s=>{const i=rnd(s.length-1);return s[i]===s[i+1]?null:s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2);},
    s=>{const idx=[...s].map((c,i)=>v.includes(c)?i:-1).filter(i=>i>=0);if(!idx.length)return null;const i=idx[rnd(idx.length)];const alt=v.replace(s[i],'');return s.slice(0,i)+alt[rnd(alt.length)]+s.slice(i+1);},
    s=>{const i=1+rnd(s.length-1);return s.slice(0,i)+s.slice(i+1);},
    s=>{const i=1+rnd(s.length-1);return s.slice(0,i)+s[i]+s.slice(i);}
  ];
  return ops[rnd(ops.length)](en);
}
function decoys(w,n){
  const set=new Set();
  if(w.lastMiss&&w.lastMiss!==w.en)set.add(w.lastMiss);
  let guard=0;
  while(set.size<n&&guard++<60){const f=misspell(w.en);if(f&&f!==w.en&&f.length>1)set.add(f);}
  const others=shuffle(S.words.filter(x=>x.en!==w.en)).map(x=>x.en);
  for(const o of others){if(set.size>=n)break;set.add(o);}
  return [...set].slice(0,n);
}
GAMES.spot=w=>{
  const opts=shuffle([w.en,...decoys(w,3)]);
  $('#g').innerHTML=`<div class="prompt"><div class="lbl" style="color:rgba(255,255,255,.8)">🕵️ 진짜 철자는 딱 하나!</div><div class="ko">${esc(w.ko)}</div></div>
    <div class="opts">${opts.map(o=>`<button class="opt en" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
  bindOpts('v',w.en,w.en);
};

GAMES.match=w=>{
  const others=shuffle(S.words.filter(x=>x.id!==w.id&&x.en!==w.en&&x.ko!==w.ko)).slice(0,3);
  const set=shuffle([w,...others]),order=shuffle(set),found=new Set();

    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;
      if(b.dataset.id===cur.id){
        found.add(cur.id);b.classList.add('ok');speak(cur.en);i++;
        if(i>=order.length){done=true;$('#g').insertAdjacentHTML('beforeend',wrongOnW?`<div class="wrongmsg"><span class="cheer">${pick(CHEER)}</span></div>`:fbHtml(true));setTimeout(()=>answer(!wrongOnW),1000);}
        else setTimeout(draw,450);
      }else{
        b.classList.add('bad');if(cur.id===w.id)wrongOnW=true;
        setTimeout(()=>b.classList.remove('bad'),450);
      }
    });
  };
  draw();
};

  on('joinfam',()=>{const v=$('#famin').value.trim();if(v.length===6)joinFam(v);else toast('코드 6자리를 넣어주세요');});
  on('copylink',()=>{navigator.clipboard&&navigator.clipboard.writeText(link).then(()=>toast('복사했어요'),()=>toast(link));});
  on('leave',()=>ask('이 기기의 클라우드 연결을 끊을까요? (데이터는 클라우드에 남아요)',()=>{localStorage.removeItem(FAM_KEY);location.reload();}));
}

cloudInit();
showHome();
</script>
</body>
</html>
